<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台登录 - 电商运营后台</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #dfe3e8;
        --text: #1d2733;
        --muted: #667085;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        padding: 18px;
      }
      .login {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
      }
      h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 0; }
      .muted { color: var(--muted); margin-bottom: 18px; }
      form { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; color: var(--muted); font-weight: 600; }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font: inherit;
        color: var(--text);
        background: #fff;
      }
      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 11px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--accent-strong); }
      .error {
        color: var(--danger);
        background: #fff1f2;
        border: 1px solid #fecdd3;
        border-radius: 6px;
        padding: 9px 10px;
      }
    </style>
  </head>
  <body>
    <main class="login">
      <h1>电商运营后台</h1>
      <div class="muted">请输入管理员账号继续</div>
      {% if error %}
      <div class="error">邮箱或密码不正确，请重新输入。</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <input type="hidden" name="next_path" value="{{ next_path }}">
        <label>邮箱<input name="email" type="email" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录后台</button>
      </form>
    </main>
  </body>
</html>
