<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}中文电商商城{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #fff;
        --line: #dfe3e8;
        --text: #182230;
        --muted: #667085;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --danger: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,.96);
        border-bottom: 1px solid var(--line);
      }
      .bar, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
      .bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { color: var(--text); font-size: 18px; font-weight: 800; text-decoration: none; }
      .nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .nav a, .link { color: var(--accent-strong); font-weight: 700; text-decoration: none; }
      main { padding: 24px 0 40px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: 0; }
      h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0; }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 14px; }
      .layout { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
      .products { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .panel, .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .product-image {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 6px;
        background: #eef2f6;
        border: 1px solid var(--line);
      }
      .placeholder {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      form { display: grid; gap: 10px; }
      label { display: grid; gap: 6px; color: var(--muted); font-weight: 700; }
      input, select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        font: inherit;
        background: #fff;
      }
      .button {
        border: 0;
        border-radius: 6px;
        min-height: 40px;
        padding: 9px 13px;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      .button:hover { background: var(--accent-strong); }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: left; }
      .error { color: var(--danger); font-weight: 700; }
      @media (max-width: 860px) {
        .layout { grid-template-columns: 1fr; }
        .bar { align-items: flex-start; flex-direction: column; padding: 12px 0; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" href="/store">中文电商商城</a>
        <nav class="nav">
          <a href="/store">商品</a>
          <a href="/admin">运营后台</a>
          <a href="/docs">接口文档</a>
        </nav>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
